# Airflow 2.x (LocalExecutor) + Postgres + MinIO. One command: docker compose up -d
x-airflow-common: &airflow-common
  image: apache/airflow:2.10.5-python3.11
  user: "${AIRFLOW_UID:-50000}:0"
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_WEBSERVER_SECRET_KEY:-dev-only-change-me}
    _PIP_ADDITIONAL_REQUIREMENTS: "pandas pyarrow pyyaml"   # dev convenience; bake into an image for prod
    MINIO_BUCKET: ${MINIO_BUCKET}
    AIRFLOW_CONN_MINIO_DEFAULT: '{"conn_type":"aws","login":"${MINIO_ROOT_USER}","password":"${MINIO_ROOT_PASSWORD}","extra":{"endpoint_url":"http://minio:9000"}}'
  volumes:
    - ./dags:/opt/airflow/dags
    - ./schema_contract.yaml:/opt/airflow/schema_contract.yaml:ro
    - ./manifest.yaml:/opt/airflow/manifest.yaml:ro
    - ./logs:/opt/airflow/logs
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      retries: 10

  airflow-init:
    <<: *airflow-common
    command:
      - bash
      - -c
      - >
        airflow db migrate &&
        airflow users create --role Admin --username "${AIRFLOW_ADMIN_USER}"
        --password "${AIRFLOW_ADMIN_PASSWORD}" --firstname Admin --lastname User
        --email admin@example.com || true

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8080:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

    minio:
    image: cgr.dev/chainguard/minio:latest
    user: root
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    restart: unless-stopped

volumes:
  postgres-data:
  minio-data:
  